[package]
name = "bittorrent-rs"
version = "0.1.0"
edition = "2024"
autobins = false

[[bin]]
name = "bittorrent"
path = "src/bin/bittorrent/main.rs"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
indexing_slicing = "deny"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
reqwest = "0.13.4"
rand = "0.10.2"
sha1 = "0.11.0"
urlencoding = "2.1.3"
tokio = { version = "1.53.1", features = ["full"] }
zerocopy = { version = "0.8.63", features = ["derive"] }
tokio-util = { version = "0.7.20", features = ["codec"] }
bytes = "1.12.1"
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "alloc"] }
bitvec = "1.1.1"
indicatif = "0.18.6"
parking_lot = "0.13.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
url = "2.5.8"
socket2 = "0.6.5"
data-encoding = "2.11.1"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["test-util"] }

