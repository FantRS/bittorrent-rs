[package]
name = "bittorrent-rs"
version = "0.1.0"
edition = "2024"
autobins = false

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
reqwest = { version = "0.13.4", features = ["json"] }
rand = "0.10.2"
sha1 = "0.11.0"
urlencoding = "2.1.3"
tokio = { version = "1.53.1", features = ["full"] }

[[bin]]
name = "bittorrent"
path = "src/bin/main.rs"
